name: Pump alert

on:
  schedule:
    # Every 15 minutes. GitHub can delay scheduled crons under load: the actual
    # interval tends to run longer. That's not an issue for 24h pumps.
    #
    # Each run keeps scanning for about 13 minutes (Run:MaxRunMinutes) instead of
    # exiting immediately, which is a leftover from when this repo also ran the
    # early-pump detector (now split into its own repo) and made that module ~13x
    # more responsive at no extra cost to the 24h detector. That makes a run cost
    # ~14 billable minutes: free while the repo is public, expensive if it ever goes
    # private — set Run:MaxRunMinutes to 0 there to go back to one scan per run, which
    # is plenty for a detector that only needs to notice a 24h change.
    - cron: '*/15 * * * *'
  workflow_dispatch:

# Needed so the workflow can commit the state back to the repo.
permissions:
  contents: write

# Two concurrent runs would clash pushing the state.
concurrency:
  group: pump-alert
  cancel-in-progress: false

jobs:
  alert:
    runs-on: ubuntu-latest

    # A scanning run lasts ~13 minutes by design; this only catches one that hangs,
    # and stays under the 15-minute cron so runs never pile up.
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # appsettings.json isn't in the repo (it carries the token). appsettings.ci.json
      # is the config that governs these runs; secrets come in as environment
      # variables in the next step.
      - name: Prepare configuration
        run: cp src/CoslyHighPriceBot/appsettings.ci.json src/CoslyHighPriceBot/appsettings.json

      - name: Find pumps and alert
        env:
          Telegram__BotToken: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          Telegram__ChatIds: ${{ secrets.TELEGRAM_CHAT_IDS }}
          # Absolute paths inside the repo so the state stays version-controlled.
          State__NotifiedSymbolsFile: ${{ github.workspace }}/state/notified-symbols.json
          State__NotifiedStocksFile: ${{ github.workspace }}/state/notified-stocks.json
        run: dotnet run --project src/CoslyHighPriceBot -c Release

      # always() so the log stays available especially when the run fails,
      # which is exactly when you need to read it.
      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: log-${{ github.run_number }}
          path: src/CoslyHighPriceBot/bin/Release/**/Logs/*.log
          if-no-files-found: error
          retention-days: 90

      # If the run fails this step is never reached, so a Telegram error never
      # leaves a coin marked as notified when it was never actually sent. A run only
      # reports failure when its *last* scan failed: an earlier transient error that a
      # later scan recovered from leaves the state on disk consistent and worth keeping.
      - name: Save notified symbols
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add state/notified-symbols.json state/notified-stocks.json
          if git diff --staged --quiet; then
            echo "No changes to the state."
          else
            git commit -m "Update notified symbols [skip ci]"
            git push
          fi
