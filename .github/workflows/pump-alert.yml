name: Pump alert

on:
  schedule:
    # Every 15 minutes. GitHub can delay scheduled crons under load: the actual
    # interval tends to run longer. That's not an issue for 24h pumps.
    - cron: '*/15 * * * *'
  workflow_dispatch:

# Needed so the workflow can commit the state back to the repo.
permissions:
  contents: write

# Two concurrent runs would clash pushing the state.
concurrency:
  group: pump-alert
  cancel-in-progress: false

jobs:
  alert:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # appsettings.json isn't in the repo (it carries the token). appsettings.ci.json
      # is the config that governs these runs; secrets come in as environment
      # variables in the next step.
      - name: Prepare configuration
        run: cp src/CoslyHighPriceBot/appsettings.ci.json src/CoslyHighPriceBot/appsettings.json

      - name: Find pumps and alert
        env:
          Telegram__BotToken: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          Telegram__ChatId: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Absolute path inside the repo so the state stays version-controlled.
          State__NotifiedSymbolsFile: ${{ github.workspace }}/state/notified-symbols.json
        run: dotnet run --project src/CoslyHighPriceBot -c Release

      # always() so the log stays available especially when the run fails,
      # which is exactly when you need to read it.
      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: log-${{ github.run_number }}
          path: src/CoslyHighPriceBot/bin/Release/**/Logs/*.log
          if-no-files-found: error
          retention-days: 90

      # If the run fails this step is never reached, so a Telegram error never
      # leaves a coin marked as notified when it was never actually sent.
      - name: Save notified symbols
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add state/notified-symbols.json
          if git diff --staged --quiet; then
            echo "No changes to the state."
          else
            git commit -m "Update notified symbols [skip ci]"
            git push
          fi
