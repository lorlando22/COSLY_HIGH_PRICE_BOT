name: Geo check (temporary)

# One-off diagnostic: checks whether Binance's futures API answers from a GitHub
# runner, or blocks it with 451 the way api.binance.com does. Delete once answered.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe Binance endpoints
        run: |
          for url in \
            "https://fapi.binance.com/fapi/v1/ping" \
            "https://fapi1.binance.com/fapi/v1/ping" \
            "https://api.binance.com/api/v3/ping" \
            "https://data-api.binance.vision/api/v3/ping"
          do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$url" || echo "timeout")
            printf 'RESULT %-52s -> %s\n' "$url" "$code"
          done
          echo "--- futures exchangeInfo (size + first bytes) ---"
          curl -s --max-time 30 "https://fapi.binance.com/fapi/v1/exchangeInfo" -o /tmp/fapi.json -w 'http=%{http_code} bytes=%{size_download}\n' || true
          head -c 200 /tmp/fapi.json || true
