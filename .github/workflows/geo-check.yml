name: Geo check (temporary)

# One-off diagnostic: can www.binance.com serve real futures data from a GitHub runner?
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe www.binance.com futures endpoints
        run: |
          B=https://www.binance.com

          echo "--- ticker/24hr for BTRUSDT ---"
          code=$(curl -sL -o /tmp/t -w '%{http_code}' --max-time 25 "$B/fapi/v1/ticker/24hr?symbol=BTRUSDT")
          echo "http=$code"; head -c 300 /tmp/t; echo

          echo "--- ticker/24hr full list (size + count) ---"
          code=$(curl -sL -o /tmp/all -w '%{http_code}' --max-time 40 "$B/fapi/v1/ticker/24hr")
          echo "http=$code bytes=$(stat -c%s /tmp/all)"
          echo "symbols: $(grep -o '"symbol"' /tmp/all | wc -l)"

          echo "--- exchangeInfo (size + TRADIFI count) ---"
          code=$(curl -sL -o /tmp/ei -w '%{http_code}' --max-time 40 "$B/fapi/v1/exchangeInfo")
          echo "http=$code bytes=$(stat -c%s /tmp/ei)"
          echo "TRADIFI_PERPETUAL: $(grep -o 'TRADIFI_PERPETUAL' /tmp/ei | wc -l)"
          echo "PERPETUAL total:   $(grep -o '"contractType":"PERPETUAL"' /tmp/ei | wc -l)"
