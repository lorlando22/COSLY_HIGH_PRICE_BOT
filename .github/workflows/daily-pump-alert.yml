name: 24h pump alert

on:
  schedule:
    # Every 10 minutes. GitHub delays scheduled crons under load, so the real interval
    # tends to run longer — which is fine for a detector that reports a 24-hour change.
    #
    # Each run is a SINGLE pass (Run:MaxRunMinutes = 0 in appsettings.ci.json) and costs
    # about a minute. The old 13-minute scanning loop existed for the early-pump detector
    # that used to share this repo; now that it lives in its own repo and runs locally,
    # the cron itself is the scan cadence and a run has no reason to stay alive.
    - cron: '*/10 * * * *'
  workflow_dispatch:

# Needed so the workflow can commit the state back to the repo.
permissions:
  contents: write

# Two concurrent runs would clash pushing the state.
concurrency:
  group: daily-pump-alert
  cancel-in-progress: false

jobs:
  alert:
    runs-on: ubuntu-latest

    # A single pass takes about a minute; this only catches a run that hangs, and stays
    # under the 10-minute cron so runs never pile up.
    timeout-minutes: 8

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # appsettings.json isn't in the repo (it carries the token). appsettings.ci.json
      # is the config that governs these runs; secrets come in as environment
      # variables in the next step.
      - name: Prepare configuration
        run: cp src/CoslyHighPriceBot/appsettings.ci.json src/CoslyHighPriceBot/appsettings.json

      - name: Find pumps and alert
        env:
          Telegram__BotToken: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          Telegram__ChatIds: ${{ secrets.TELEGRAM_CHAT_IDS }}
          # Absolute paths inside the repo so the state stays version-controlled.
          State__NotifiedSymbolsFile: ${{ github.workspace }}/state/notified-symbols.json
          State__NotifiedStocksFile: ${{ github.workspace }}/state/notified-stocks.json
        run: dotnet run --project src/CoslyHighPriceBot -c Release

      # always() so the log stays available especially when the run fails,
      # which is exactly when you need to read it.
      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: log-${{ github.run_number }}
          path: src/CoslyHighPriceBot/bin/Release/**/Logs/*.log
          if-no-files-found: error
          retention-days: 90

      # If the run fails this step is never reached, so a Telegram error never leaves a
      # coin marked as notified when it was never actually sent: the next run retries.
      - name: Save notified symbols
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add state/notified-symbols.json state/notified-stocks.json
          if git diff --staged --quiet; then
            echo "No changes to the state."
          else
            git commit -m "Update notified symbols [skip ci]"
            git push
          fi
